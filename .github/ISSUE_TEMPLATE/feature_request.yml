name: "✨ Feature Request"
description: "Suggest an idea or enhancement for Vesper"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Have an idea to make Vesper even better? Let us know!"
  - type: textarea
    id: problem
    attributes:
      label: "Problem or Opportunity"
      description: "Is your feature request related to a problem or workflow improvement?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe what you would like Vesper to do."
    validations:
      required: true
