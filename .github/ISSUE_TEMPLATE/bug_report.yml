name: "🐛 Bug Report"
description: "File a bug report to help us improve Vesper"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thank you for reporting an issue! Please describe the bug clearly."
  - type: input
    id: os
    attributes:
      label: "Operating System"
      description: "e.g., Windows 11 23H2 or Windows 10"
      placeholder: "Windows 11"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what happened."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps To Reproduce"
      description: "How can we reproduce the behavior?"
      placeholder: |
        1. Start Vesper
        2. Hold Ctrl+Win and speak
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Log Output"
      description: "Paste any relevant logs from vesper.log or run_console.bat"
      render: shell
